name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required meta files exist
        run: |
          test -f LICENSE
          test -f README.md
          test -f README.ru.md
          test -f CHANGELOG.md

      - name: Example filter is valid JSON
        run: python -c "import json,sys; json.load(open('examples/filters.example.json'))"

      - name: Internal link sanity (no broken relative paths)
        run: |
          python - <<'PY'
          import re, pathlib, sys
          rx = re.compile(r"\]\(([^)#:]+)\)")
          bad = []
          for md in pathlib.Path('.').rglob('*.md'):
              for m in rx.finditer(md.read_text(encoding='utf-8')):
                  link = m.group(1).strip()
                  if link.startswith(('http://','https://','mailto:')): continue
                  p = (md.parent / link).resolve()
                  if not p.exists(): bad.append(f"{md}: {link}")
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('all relative links resolve')
          PY
